name: FirstWord events
on:
  schedule:
    - cron: "17 6 * * *"      # once a day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      # xvfb gives the script a display so it can retry in a headed browser
      - run: xvfb-run -a python firstword_events.py
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fw_debug
          path: fw_debug/
          if-no-files-found: ignore
      - name: Commit calendar
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add firstword_events.ics
          git diff --cached --quiet || git commit -m "Update FirstWord events"
          git push
